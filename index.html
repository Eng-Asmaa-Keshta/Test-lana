<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Database Quest – Prep 1 ICT</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#5b3df5;--bg2:#00b4d8;--card:#fff;--ink:#1d2340;--soft:#eef1ff;--ok:#12b76a;--bad:#f04438;--acc:#ff9f1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1b7a;--bg2:#06526b;--card:#1c2140;--ink:#eef0ff;--soft:#2a3060}}
:root[data-theme="dark"]{--bg1:#2a1b7a;--bg2:#06526b;--card:#1c2140;--ink:#eef0ff;--soft:#2a3060}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Trebuchet MS",Verdana,Tahoma,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--ink);background-attachment:fixed}
#app{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:14px;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hero{text-align:center}
.hero .big{font-size:64px;line-height:1}
h1{margin:6px 0;font-size:28px;background:linear-gradient(90deg,#5b3df5,#00b4d8);-webkit-background-clip:text;background-clip:text;color:transparent}
.ded{background:linear-gradient(135deg,#fff3d6,#ffe0f0);color:#3b2a00;border:2px dashed #ff9f1c;border-radius:16px;padding:12px;margin:14px 0;font-size:15px}
.ded b{display:block;font-size:17px;color:#b4237a}
.btn{border:0;border-radius:14px;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#5b3df5,#7c5cff);box-shadow:0 4px 0 rgba(0,0,0,.2);font-family:inherit}
.btn:active{transform:translateY(2px)}
.btn.go{background:linear-gradient(135deg,#12b76a,#06a05a)}
.btn.ex{background:linear-gradient(135deg,#f04438,#d92d20);padding:8px 12px;font-size:14px}
.btn.or{background:linear-gradient(135deg,#ff9f1c,#ff7a00)}
.btn[disabled]{opacity:.5}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#fff;margin-bottom:10px;font-weight:700}
.pill{background:rgba(255,255,255,.2);border-radius:999px;padding:7px 14px;font-size:15px}
.bar{height:10px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd60a,#ff9f1c);transition:width .4s}
.tag{display:inline-block;background:var(--soft);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;margin-bottom:8px}
.q{font-size:20px;font-weight:700;margin:6px 0 14px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;background:var(--soft);color:var(--ink);border:3px solid transparent;border-radius:14px;padding:13px 15px;margin:9px 0;font-size:17px;cursor:pointer;font-family:inherit}
.opt:hover:not([disabled]){border-color:#7c5cff}
.opt.ok{background:#d1fadf;border-color:var(--ok);color:#054f31}
.opt.no{background:#fee4e2;border-color:var(--bad);color:#7a271a;animation:shake .4s}
textarea{width:100%;min-height:150px;border-radius:14px;border:3px solid #c7d0ff;padding:12px;font-size:16px;font-family:inherit;background:var(--card);color:var(--ink)}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:700}
.fb.ok{background:#d1fadf;color:#054f31}.fb.no{background:#fee4e2;color:#7a271a}.fb.mid{background:#fff1c2;color:#6b4b00}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov .card{max-width:340px;text-align:center}
.rc{background:#fff;color:#1d2340;border-radius:20px;overflow:hidden;border:3px solid #7c5cff;margin-bottom:16px}
.rc .hd{background:linear-gradient(135deg,#5b3df5,#00b4d8);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.rc .bd{padding:14px}
.badge{display:inline-block;font-size:34px}
.you{background:#f3f4f9;border-radius:12px;padding:10px;margin:8px 0;font-size:15px;white-space:pre-wrap}
.model{background:linear-gradient(135deg,#e6fff3,#e0f4ff);border-left:8px solid #12b76a;border-radius:12px;padding:12px;margin:8px 0;font-size:15px}
.model h4{margin:0 0 6px;color:#067647}
.chip{display:inline-block;border-radius:999px;padding:4px 10px;margin:3px;font-size:13px;font-weight:700}
.chip.y{background:#d1fadf;color:#054f31}.chip.n{background:#fee4e2;color:#7a271a}
.ft{background:#1d2340;color:#fff;font-size:12px;text-align:center;padding:8px}
.sum{text-align:center}
.sum .num{font-size:56px;font-weight:900;color:#5b3df5}
.hearts{letter-spacing:2px}
.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
</style></head>
<body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const DED="إهداء من م. أسماء قشطه";
const DED2="الخبير المعتمد من المعهد القومي للاتصالات وتكنولوجيا المعلومات";
const TEL="01007243344";
const Q=[
{t:"mc",q:"A database is a collection of ……….",o:["books","data and information","images","applications"],a:1,why:"A database is a collection of data and information that is organized and linked to each other."},
{t:"mc",q:"………. is the Office program that enables you to create a database.",o:["Word","Paint","Access","PowerPoint"],a:2,why:"Microsoft Access enables you to create and manage databases."},
{t:"mc",q:"Databases are used in hospitals to store ……….",o:["books","patients’ medical records","movies","clothes"],a:1,why:"Hospitals save patient names, doctors, addresses and last-visit dates in databases."},
{t:"mc",q:"You should use the ………. program if you have a large amount of complex data.",o:["Excel","Access","Word","Paint"],a:1,why:"Excel is difficult with large complex data, so we use Microsoft Access."},
{t:"mc",q:"In the data table, each ………. represents one record of data.",o:["row","column","cell","file"],a:0,why:"Each row = one record. Each column = one field."},
{t:"mc",q:"Big Data refers to ……….",o:["small data sets","simple data","very large and complex data sets","images and videos"],a:2,why:"Big Data means very large, diverse sets of data that keep growing over time."},
{t:"mc",q:"To enter and view the table data in MS Access, select ……….",o:["Datasheet View","Design View","Table Design","none of them"],a:0,why:"Datasheet View is used to enter and display the table data."},
{t:"mc",q:"We set the data type of the grade fields to ………. to perform calculations.",o:["Date","Text","Number","none of them"],a:2,why:"Grades must be Number so we can do calculations on them."},
{t:"tf",q:"The Primary Key value can be repeated within the same table.",o:["✓ True","✗ False"],a:1,why:"The primary key value is NEVER repeated – it identifies each record uniquely."},
{t:"tf",q:"One advantage of using databases is the easy retrieval of data.",o:["✓ True","✗ False"],a:0,why:"Organization: easy storage and retrieval of data is a key advantage."},
{t:"es",q:"Define a database and mention TWO advantages of using databases.",model:"A database is a collection of data and information that is organized and linked to each other. Advantages: 1) Organization – easy storage and retrieval of data. 2) Efficiency – quick access to data. (Also: accuracy, security, sharing.)",
 g:[["Collection of data and information",/collection|set of data|data and information/i],["Organized and linked",/organi[sz]ed|linked|related/i],["Advantage: organization / efficiency",/organi[sz]ation|efficien|quick|easy/i],["Advantage: accuracy / security / sharing",/accura|secur|shar|error/i]]},
{t:"es",q:"Compare Word, Excel and Microsoft Access for creating data tables. When do we use Access?",model:"Word creates simple tables only. Excel can arrange and sort data and do simple calculations, but it is difficult with large complex data. We use Microsoft Access when we have a large amount of complex data, need relations between data, need custom applications, or need higher security.",
 g:[["Word = simple tables",/word/i],["Excel = sort & simple calculations",/excel|sort|calculat|arrange/i],["Access = large complex data",/large|complex/i],["Access = relations / security / applications",/relation|secur|application/i]]},
{t:"es",q:"Explain how to design the “Students Grades” table in Access (fields, data types and saving).",model:"Open Table Design window. ID = AutoNumber (primary key), Name = Short Text, Arabic Grade / English Grade / Computer Grade = Number. Then click Save and type the table name “Students Grades”.",
 g:[["Open Table Design",/table design|design view/i],["ID = AutoNumber / primary key",/autonumber|primary/i],["Name = Short Text",/text/i],["Grades = Number",/number/i],["Save the table",/save/i]]}
];
const $=s=>document.getElementById(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let i,score,lives,log;
const app=$("app");
function ded(){return `<div class="ded" dir="rtl"><b>🎁 ${DED}</b>${DED2}<br>📞 <span dir="ltr">${TEL}</span></div>`}
function home(){
 app.innerHTML=`<div class="card hero"><div class="big">🗄️🚀</div><h1>Database Quest</h1>
 <div>Prep 1 • ICT • Lesson 8: Database Design</div>${ded()}
 <p>Answer <b>10 quick questions</b> and <b>3 essay questions</b>.<br>You have <b>3 ❤️ lives</b>. Wrong answer = lose a life!<br>Collect as many ⭐ points as you can.</p>
 <button class="btn go" id="st">▶ Start Game</button></div>`;
 $("st").onclick=()=>{i=0;score=0;lives=3;log=[];ask()};
}
function hud(){
 return `<div class="hud"><span class="pill">⭐ Score: ${score}</span><span class="pill hearts">${"❤️".repeat(lives)}${"🖤".repeat(3-lives)}</span><button class="btn ex" id="ex">✖ Exit</button></div>
 <div class="bar"><i style="width:${i/Q.length*100}%"></i></div>`;
}
function exitBtn(){
 $("ex").onclick=()=>{
  const o=document.createElement("div");o.className="ov";
  o.innerHTML=`<div class="card"><div style="font-size:44px">🚪</div><h3>Exit the game?</h3><p>Your progress will be lost.</p><div class="row" style="justify-content:center"><button class="btn go" id="n">Keep playing</button><button class="btn ex" id="y">Exit</button></div></div>`;
  document.body.appendChild(o);
  o.querySelector("#n").onclick=()=>o.remove();
  o.querySelector("#y").onclick=()=>{o.remove();home()};
 };
}
function next(){
 i++;
 if(lives<=0||i>=Q.length)return results();
 ask();
}
function ask(){
 const q=Q[i];
 if(q.t==="es"){
  app.innerHTML=hud()+`<div class="card"><span class="tag">✍️ Essay ${i-9} of 3 • 10 pts</span><div class="q">${q.q}</div>
  <textarea id="ta" placeholder="Write your answer in English…"></textarea>
  <div id="fb"></div><div class="row"><span></span><button class="btn or" id="sub">Submit ✔</button></div></div>`;
  exitBtn();
  $("sub").onclick=()=>{
   const txt=$("ta").value.trim();
   if(txt.length<5){$("fb").innerHTML='<div class="fb mid">Please write your answer first ✍️</div>';return}
   $("ta").disabled=true;$("sub").remove();
   const hits=q.g.map(g=>g[1].test(txt));
   const n=hits.filter(Boolean).length,pts=Math.round(10*n/q.g.length);
   score+=pts;
   const bad=n/q.g.length<.5;if(bad)lives--;
   log.push({q:q.q,type:"Essay",mine:txt,pts,max:10,ok:!bad,model:q.model,chips:q.g.map((g,k)=>[g[0],hits[k]])});
   $("fb").innerHTML=`<div class="fb ${bad?"no":n===q.g.length?"ok":"mid"}">${bad?"💔 Not enough key points (−1 life). ":"🎉 "}You earned ${pts}/10 points!</div>
   <div class="row"><span>${n}/${q.g.length} key points</span><button class="btn go" id="nx">${(lives<=0||i===Q.length-1)?"See results 🏆":"Next →"}</button></div>`;
   $("nx").onclick=next;
  };
  return;
 }
 app.innerHTML=hud()+`<div class="card"><span class="tag">${q.t==="tf"?"✓/✗ True or False":"🧠 Choose"} • Q${i+1} • 7 pts</span><div class="q">${q.q}</div>
 <div id="os">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${String.fromCharCode(65+k)}. ${o}</button>`).join("")}</div><div id="fb"></div></div>`;
 exitBtn();
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const k=+b.dataset.k,ok=k===q.a;
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("ok")});
  if(!ok)b.classList.add("no");
  if(ok)score+=7;else lives--;
  log.push({q:q.q,type:q.t==="tf"?"True / False":"Multiple Choice",mine:q.o[k],pts:ok?7:0,max:7,ok,model:q.o[q.a]+" — "+q.why});
  $("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"🎉 Correct! +7 points":"💔 Oops! −1 life"}<br><span style="font-weight:400">${q.why}</span></div>
  <div class="row"><span></span><button class="btn go" id="nx">${(lives<=0||i===Q.length-1)?"See results 🏆":"Next →"}</button></div>`;
  $("nx").onclick=next;
 });
}
function card(l,n){
 return `<div class="rc" id="rc${n}"><div class="hd"><span>Question ${n+1} • ${l.type}</span><span>${l.pts}/${l.max} pts</span></div>
 <div class="bd"><div style="font-weight:700;font-size:16px">${l.q}</div>
 <div><span class="badge">${l.ok?"✅":"❌"}</span> <b>Your answer:</b></div><div class="you">${esc(l.mine)}</div>
 ${l.chips?`<div>${l.chips.map(c=>`<span class="chip ${c[1]?"y":"n"}">${c[1]?"✔":"✘"} ${c[0]}</span>`).join("")}</div>`:""}
 <div class="model"><h4>🌟 Model Answer</h4>${esc(l.model)}</div></div>
 <div class="ft" dir="rtl">${DED} • ${DED2} • <span dir="ltr">${TEL}</span></div></div>`;
}
function results(){
 const max=Q.reduce((s,q)=>s+(q.t==="es"?10:7),0);
 const over=lives<=0&&log.length<Q.length;
 const medal=score>=85?"🏆 Database Master":score>=60?"🥈 Great Job":"🌱 Keep Practicing";
 app.innerHTML=`<div class="card sum" id="sumc"><div style="font-size:56px">${over?"💀":"🎓"}</div><h1>${over?"Game Over":"Quest Complete!"}</h1>
 <div class="num">${score}<span style="font-size:22px"> / ${max}</span></div><div style="font-size:20px;font-weight:700">${medal}</div>
 <div class="hearts" style="font-size:24px">${"❤️".repeat(lives)}${"🖤".repeat(3-lives)}</div>
 <div style="font-size:14px">Answered ${log.length} of ${Q.length} questions</div>${ded()}
 <div class="links"><button class="btn or" id="pdf">⬇ Download answers (PDF)</button><button class="btn go" id="again">🔄 Play again</button></div><div id="msg" style="margin-top:8px;font-size:14px"></div></div>
 <h2 style="color:#fff;text-align:center">📋 Corrections &amp; Model Answers</h2>${log.map(card).join("")}`;
 $("again").onclick=home;
 $("pdf").onclick=makePdf;
}
async function makePdf(){
 const msg=$("msg"),btn=$("pdf");
  btn.disabled=true;msg.textContent="⏳ Creating your PDF…";
 try{
  const {jsPDF}=window.jspdf;const pdf=new jsPDF("p","mm","a4");
  const ids=["sumc",...log.map((_,n)=>"rc"+n)];
  for(let k=0;k<ids.length;k++){
   const el=$(ids[k]);
   const cv=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",useCORS:true});
   let w=190,h=cv.height*w/cv.width;if(h>277){h=277;w=cv.width*h/cv.height}
   if(k)pdf.addPage();
   pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",(210-w)/2,10,w,h);
  }
  pdf.save("Database-Quest-Answers.pdf");
  msg.textContent="✅ Done!";
 }catch(e){msg.textContent="Couldn’t create the PDF. Please try again."}
 btn.disabled=false;
}
home();
</script></body></html>
